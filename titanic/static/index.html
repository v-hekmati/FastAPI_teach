<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Titanic Survival Predictor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #ccc;
        }

    </style>

</head>


<body>


<h1>Titanic Survival Predictor</h1>


<form id="predictionForm">

    <label for="age">
        Age
    </label>

    <input
        type="number"
        id="age"
        min="0.1"
        max="100"
        step="0.1"
        required
    >


    <label for="sex">
        Sex
    </label>

    <select id="sex">

        <option value="male">
            Male
        </option>

        <option value="female">
            Female
        </option>

    </select>


    <button type="submit">
        Predict
    </button>

</form>


<div id="result">

    Enter passenger information.

</div>


<script>

    const form = document.getElementById(
        "predictionForm"
    );

    const resultDiv = document.getElementById(
        "result"
    );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const age = parseFloat(
                document.getElementById("age").value
            );

            const sex =
                document.getElementById("sex").value;


            const passenger = {
                age: age,
                sex: sex
            };


            const response = await fetch(
                "/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(passenger)
                }
            );


            if (!response.ok) {

                const error = await response.json();

                resultDiv.innerHTML =
                    "Error: " +
                    JSON.stringify(error);

                return;
            }


            const data = await response.json();


            resultDiv.innerHTML = `
                <h2>Result</h2>

                <p>
                    Age:
                    ${data.age}
                </p>

                <p>
                    Sex:
                    ${data.sex}
                </p>

                <p>
                    Prediction:
                    <strong>
                        ${data.prediction}
                    </strong>
                </p>

                <p>
                    Survival probability:
                    <strong>
                        ${data.survival_probability}%
                    </strong>
                </p>

                <p>
                    Death probability:
                    ${data.death_probability}%
                </p>
            `;

        }
    );

</script>


</body>

</html>
